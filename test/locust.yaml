apiVersion: locust.io/v1
kind: LocustTest
metadata:
  name: load-test
spec:
  workers: 2
  locustfile:
    content: |
      from locust import HttpUser, task


      class MainHandlerUser(HttpUser):
          weight = 1

          @task
          def call_main_handler(self):
              self.client.get("/", name="Main UI/API")


      class SleepHandlerUser(HttpUser):
          weight = 1

          @task
          def call_sleep_handler(self):
              self.client.get("/sleep", name="Sleep handler")
